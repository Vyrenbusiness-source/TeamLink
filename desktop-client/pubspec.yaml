name: desktop_client
description: TeamLink desktop client
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  web_socket_channel: ^2.4.0
  http: ^1.2.0
  intl: ^0.20.2
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  msix: ^3.16.7

flutter:
  uses-material-design: true

msix_config:
  display_name: TeamLink
  publisher_display_name: TeamLink
  identity_name: com.teamlink.desktop
  publisher: CN=TeamLink
  msix_version: 1.0.0.0
  capabilities: internetClient
  store: false
